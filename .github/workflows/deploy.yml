name: Deploy Backlink Backend to Cloudways

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy files to Cloudways via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "src,package.json,package-lock.json,ecosystem.config.js,prisma"
          target: "/home/489042.cloudwaysapps.com/sspcnhpfsd/public_html"

      - name: SSH and Remote Deploy Execution
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Dynamically source NVM to upgrade the shell context to Node 22
            export NVM_DIR="/home/489042.cloudwaysapps.com/sspcnhpfsd/public_html/.nvm"
            if [ ! -s "$NVM_DIR/nvm.sh" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            fi
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22 || nvm install 22

            # 2. Step into your public web application root space
            cd /home/489042.cloudwaysapps.com/sspcnhpfsd/public_html
            
            # (Git pull removed because GitHub Action SCP already uploaded the files)
            
            # 4. Synchronize application package trees and update databases
            npm install --cache=./.local-cache --no-audit --no-fund
            npx prisma generate
            
            # 5. Bring down and bounce your PM2 environment smoothly
            export PM2_HOME="/home/489042.cloudwaysapps.com/sspcnhpfsd/public_html/.pm2"
            
            # Delete the old PM2 process to permanently clear the cached Node 18 interpreter
            /home/489042.cloudwaysapps.com/sspcnhpfsd/public_html/.pm2-global/lib/node_modules/pm2/bin/pm2 delete backlink-backend || true
            
            # Start fresh using the ecosystem config which binds to the active Node 22 environment
            /home/489042.cloudwaysapps.com/sspcnhpfsd/public_html/.pm2-global/lib/node_modules/pm2/bin/pm2 start ecosystem.config.js --env production
            /home/489042.cloudwaysapps.com/sspcnhpfsd/public_html/.pm2-global/lib/node_modules/pm2/bin/pm2 save