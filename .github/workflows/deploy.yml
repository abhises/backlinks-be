name: Deploy Backlink Backend to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Copy source files to EC2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "src,prisma,package.json,package-lock.json,prisma.config.ts"
          target: "/home/ubuntu/apps/backlink-be"
          overwrite: true

      - name: Install, sync schema and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /home/ubuntu/apps/backlink-be
            export NODE_ENV=production

            # Back up the database before touching the schema
            /home/ubuntu/apps/db/backup.sh

            npm ci --no-audit --no-fund
            # No --accept-data-loss: a destructive schema change will fail the deploy instead of dropping data
            npx prisma db push
            npx prisma generate

            pm2 restart backlink-backend --update-env || pm2 start src/index.js --name backlink-backend
            pm2 save
