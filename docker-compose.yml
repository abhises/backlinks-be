version: '3.8'

services:
  backlink-db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    container_name: backlink-local-db
    environment:
      MYSQL_ROOT_PASSWORD: AAA
      MYSQL_DATABASE: backlink_dev
    ports:
      - "3308:3306"
    volumes:
      - backlink_mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  backlink_mysql_data:
