version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: serp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: serpuser
      POSTGRES_PASSWORD: serppassword
      POSTGRES_DB: serpdb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
